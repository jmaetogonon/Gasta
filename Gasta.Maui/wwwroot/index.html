<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gasta</title>
    <base href="/" />

    <!-- Apply the saved theme before the page renders (same key as ThemeService) -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('gasta-theme');
                document.documentElement.setAttribute('data-theme', saved === 'Dark' ? 'dark' : 'light');
            } catch (e) { /* ignore */ }
        })();
    </script>

    <!-- Shared project CSS: keep the ?v= numbers equal to the web host's index.html -->
    <link rel="stylesheet" href="_content/Gasta.Shared/css/theme.css?v=4" />
    <link rel="stylesheet" href="_content/Gasta.Shared/css/app.css?v=3" />
    <link rel="stylesheet" href="Gasta.Maui.styles.css" />
    <link rel="icon" href="data:," />
    <style>
        /* The PWA's ring is driven by Blazor WASM's download progress. Blazor Hybrid has none,
           so the same ring spins as an indeterminate loader instead of sitting at 0%. */
        .loading-screen.hybrid {
            --blazor-load-percentage: 28%;
            --blazor-load-percentage-text: "";
        }

            .loading-screen.hybrid .loading-ring-bar {
                transform-origin: 60px 60px;
                animation: gasta-spin 1.1s linear infinite;
            }

        @keyframes gasta-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-screen hybrid">
            <div class="loading-ring-wrap">
                <svg class="loading-ring" viewBox="0 0 120 120">
                    <circle class="loading-ring-track" cx="60" cy="60" r="54" />
                    <circle class="loading-ring-bar" cx="60" cy="60" r="54" />
                </svg>
                <div class="loading-video-wrap">
                    <div class="loading-video-crop">
                        <img class="loading-video" src="_content/Gasta.Shared/images/gasta-icon-square.gif" alt="Gasta" />
                    </div>
                </div>
            </div>
            <div class="loading-percentage"></div>
            <div class="loading-text">Loading Gasta<span class="loading-dots"><span></span><span></span><span></span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Shared project JavaScript (export.js is web-only, not needed here) -->
    <script src="_content/Gasta.Shared/js/theme.js"></script>
    <script src="_content/Gasta.Shared/js/pointer.js"></script>
    <script src="_content/Gasta.Shared/js/settingsHeader.js"></script>
    <script src="_content/Gasta.Shared/js/accentColor.js"></script>

    <script src="chrome.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
